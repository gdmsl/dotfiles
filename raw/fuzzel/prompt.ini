# fuzzel theme for small single-line text prompts (e.g. rename-workspace),
# used as `fuzzel --config ... --dmenu --prompt-only "..."`. fuzzel instead of
# tofi here because tofi's clipboard paste is unreliable (emoji often don't
# arrive). Colours follow the Tokyo Night palette and the #ff9e64 accent used
# by niri's focus ring.

[main]
font = Maple Mono NF:size=16
anchor = center
width = 40
lines = 0
horizontal-pad = 28
vertical-pad = 20

[colors]
background = 1a1b26f2
text = a9b1d6ff
input = a9b1d6ff
prompt = ff9e64ff
placeholder = 565f89ff
border = ff9e64ff

[border]
width = 2
radius = 14
